name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 platform-tools

      - name: Build prod debug APK
        run: chmod +x ./gradlew && ./gradlew :androidApp:assembleProdDebug --stacktrace
