# Tag v<versionName> on main. The tag must match versionName in androidApp/build.gradle.kts
# and a "## <version>" section in CHANGELOG.md. Signing secrets:
# KAV_KEYSTORE_BASE64, KAV_KEYSTORE_PASSWORD, KAV_KEY_ALIAS, KAV_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 platform-tools

      - name: Check tag, version, and changelog
        id: notes
        run: |
          python3 << 'PY'
          import os, pathlib, re
          ref = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+(\.[0-9]+)+", ref):
              raise SystemExit(f"Tag {ref!r} must look like v0.7 or v0.7.1")
          version = ref.removeprefix("v")
          gradle = pathlib.Path("androidApp/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          name = match.group(1) if match else ""
          if name != version:
              raise SystemExit(f"versionName is {name!r}, tag is {version!r}")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          body = ""
          for part in re.split(r"(?m)^## ", text)[1:]:
              lines = part.splitlines()
              heading = lines[0].strip()
              if heading == version or heading.startswith(version + " "):
                  body = "\n".join(lines[1:]).strip()
                  break
          if not body:
              raise SystemExit(f"CHANGELOG.md has no ## {version} notes")
          delim = "KAV_NOTES"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"body<<{delim}\n{body}\n{delim}\n")
          PY

      - name: Unit tests
        run: chmod +x ./gradlew && ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KAV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Add repo secret KAV_KEYSTORE_BASE64 (base64 of the release keystore)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release
        env:
          KAV_KEYSTORE: ${{ runner.temp }}/release.keystore
          KAV_KEYSTORE_PASSWORD: ${{ secrets.KAV_KEYSTORE_PASSWORD }}
          KAV_KEY_ALIAS: ${{ secrets.KAV_KEY_ALIAS }}
          KAV_KEY_PASSWORD: ${{ secrets.KAV_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="androidApp/build/outputs/named/kav-monitor-${VERSION}-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "Signed APK not found at $SRC"
            exit 1
          fi
          DEST="kav-monitor-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$DEST"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          make_latest: true
