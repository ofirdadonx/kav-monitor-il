name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37 platform-tools

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KAV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Add repo secret KAV_KEYSTORE_BASE64 (base64 of the release keystore)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed prod release
        env:
          KAV_KEYSTORE: ${{ runner.temp }}/release.keystore
          KAV_KEYSTORE_PASSWORD: ${{ secrets.KAV_KEYSTORE_PASSWORD }}
          KAV_KEY_ALIAS: ${{ secrets.KAV_KEY_ALIAS }}
          KAV_KEY_PASSWORD: ${{ secrets.KAV_KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew :androidApp:assembleProdRelease --stacktrace

      - name: Read changelog
        id: notes
        run: |
          python3 << 'PY'
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          body = ""
          for part in re.split(r"(?m)^## ", text)[1:]:
              lines = part.splitlines()
              heading = lines[0].strip()
              if heading == version or heading.startswith(version + " "):
                  body = "\n".join(lines[1:]).strip()
                  break
          if not body:
              body = f"Release {version}."
          delim = "KAV_NOTES"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"body<<{delim}\n{body}\n{delim}\n")
          PY

      - name: Name the APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(find androidApp/build/outputs/apk/prod/release -name '*.apk' | head -1)
          DEST="kav-monitor-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$DEST"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
